steps:
  - task: TfxInstaller@5
    inputs:
      version: "v0.x"
  - task: UseNode@1
    inputs:
      version: $(nodeVersion)
    displayName: 'Install Node.js'
  - task: Npm@1
    displayName: Install npm packages
    inputs:
      command: "install"
      workingDir: "source"
  - task: Bash@3
    displayName: Test Package
    inputs:
      targetType: "inline"
      script: |
        make test.ci
  - task: PublishTestResults@2
    inputs:
      testResultsFormat: "JUnit"
      testResultsFiles: "junit.xml"
